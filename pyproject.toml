[project]
name = "crawfish"
dynamic = ["version"]
requires-python = ">=3.12"  # pymatgen-core's minimum
authors = [{ name = "Ben Rich", email = "benjamin.rich@colorado.edu" }]
license = "MIT"
license-files = ["LICENSE"]


dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.25.0,<3",
    "numba>=0.55",
    "ase>=3.23.0",
    # Upstream main has the JDFTx IO crawfish needs (pymatgen-core PRs 319-324, merged 2026-11-25).
    # Switch to "pymatgen-core>=<release>" once a PyPI release includes them.
    "pymatgen-core @ git+https://github.com/materialsproject/pymatgen-core.git",
    "libtetrabz>=0.1.1",
]

[tool.setuptools.dynamic]
version = { attr = "crawfish.__version__" }

[tool.ruff]
target-version = "py310"
line-length = 120
output-format = "concise"

[tool.pdm.dev-dependencies]
lint = ["mypy>=1.10.0", "pre-commit>=3.7.1", "ruff>=0.4.9"]
test = ["pytest-cov>=5.0.0", "pytest-split>=0.9.0", "pytest>=8.2.2"]

[tool.pyright]
typeCheckingMode = "off"
reportPossiblyUnboundVariable = true
reportUnboundVariable = true
reportMissingImports = false
reportMissingModuleSource = false
reportInvalidTypeForm = false
exclude = ["**/tests"]

[tool.pydocstyle]
exclude = ["**/tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.codespell]
ignore-words-list = """
te,initalized,auxilliary,commun
"""
