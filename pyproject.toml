[build-system]
requires = ["setuptools>=77.0.3"]  # first setuptools that takes `license = "MIT"` as an SPDX string
build-backend = "setuptools.build_meta"

[project]
name = "co-crawfish"  # the PyPI name ("crawfish" is taken there); the import name is still `crawfish`
dynamic = ["version"]
description = "Bonding analysis (pDOS, pCOHP, pCOOP, pCOBI, pCOMO) on JDFTx calculations"
readme = "README.md"
requires-python = ">=3.12"  # pymatgen-core's minimum
authors = [{ name = "Ben Rich", email = "benjamin.rich@colorado.edu" }]
license = "MIT"
license-files = ["LICENSE"]


dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.25.0,<3",
    "numba>=0.55",
    "scipy",
    "ase>=3.23.0",
    # crawfish needs the JDFTx IO of pymatgen-core PRs 319-324 (merged 2026-11-25), which the latest PyPI
    # release (2026.10.31) lacks, and PyPI accepts no git URL here. This takes anything newer: the next
    # release, or a build of GitHub main (2026.10.31.post1.dev..., which ">2026.10.31" would refuse).
    # Switch to "pymatgen-core>=<release>" once that release exists.
    "pymatgen-core>=2026.10.31,!=2026.10.31",
    "libtetrabz>=0.1.1",
]

[project.urls]
Repository = "https://github.com/benrich37/crawfish"
Issues = "https://github.com/benrich37/crawfish/issues"

[tool.setuptools.dynamic]
version = { attr = "crawfish.__version__" }

[tool.ruff]
target-version = "py310"
line-length = 120
output-format = "concise"

[tool.pdm.dev-dependencies]
lint = ["mypy>=1.10.0", "pre-commit>=3.7.1", "ruff>=0.4.9"]
test = ["pytest-cov>=5.0.0", "pytest-split>=0.9.0", "pytest>=8.2.2"]

[tool.pyright]
typeCheckingMode = "off"
reportPossiblyUnboundVariable = true
reportUnboundVariable = true
reportMissingImports = false
reportMissingModuleSource = false
reportInvalidTypeForm = false
exclude = ["**/tests"]

[tool.pydocstyle]
exclude = ["**/tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.codespell]
ignore-words-list = """
te,initalized,auxilliary,commun
"""
